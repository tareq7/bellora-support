<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">

  <defs>
    <!-- Dark Squircle Background -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1724" />
      <stop offset="100%" stop-color="#050a10" />
    </linearGradient>
    <linearGradient id="badgeRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 225, 215, 0.45)" />
      <stop offset="50%" stop-color="rgba(0, 110, 190, 0.15)" />
      <stop offset="100%" stop-color="rgba(0, 190, 255, 0.4)" />
    </linearGradient>
    <!-- Folded B Emblem Gradients -->
    <linearGradient id="emblemTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3bf2b5" />
      <stop offset="45%" stop-color="#14d8b4" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <linearGradient id="emblemCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c8d7" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <linearGradient id="emblemBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0096c7" />
      <stop offset="60%" stop-color="#0056b3" />
      <stop offset="100%" stop-color="#023e8a" />
    </linearGradient>
    <linearGradient id="emblemSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02204c" />
      <stop offset="100%" stop-color="#004d99" />
    </linearGradient>
    <linearGradient id="emblemBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#023e8a" />
    </linearGradient>
    <!-- Text Dark/Light Gradients -->
    <linearGradient id="textDarkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="textLightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <!-- Subtle drop shadow -->
    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <g filter="url(#tileShadow)">
    <rect x="20" y="20" width="180" height="180" rx="40" ry="40" fill="url(#badgeBg)" stroke="url(#badgeRim)" stroke-width="1.5" />
  </g>
  
  <!-- Stylized B Emblem -->
  <g transform="translate(62, 45) scale(1.02)">
    <!-- Left Vertical Spine & Shadow Behind Ribbon -->
    <path d="M 5 35 L 23 45 L 23 98 L 5 88 Z" fill="url(#emblemSpine)" />
    <!-- Bottom Left Chamfer Bevel -->
    <polygon points="5,88 23,98 12,112 5,112" fill="url(#emblemBevel)" />
    <!-- Bottom Lobe -->
    <path d="M 23 68 C 50 55, 84 72, 84 96 C 84 122, 45 125, 12 112 L 23 98 C 45 106, 68 104, 68 94 C 68 82, 46 80, 23 86 Z" fill="url(#emblemBlue)" />
    <!-- Top Loop and Sweeping Diagonal Fold Ribbon -->
    <path d="M 5 22 C 5 8, 45 4, 70 14 C 90 22, 90 46, 74 58 L 5 86 L 5 70 L 60 45 C 72 38, 72 26, 60 21 C 46 15, 23 18, 23 27 Z" fill="url(#emblemTeal)" />
    <!-- Diagonal Fold Cross-Strap -->
    <path d="M 5 70 L 60 45 L 74 58 L 5 86 Z" fill="url(#emblemCyan)" />
  </g>
</svg>